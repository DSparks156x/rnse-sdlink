; PlatformIO project for the Teensy 4.1 SD-card emulator bring-up firmware.
; The same source folder (sdemu/) is also a valid Arduino/Teensyduino sketch folder.
[platformio]
src_dir = sdemu

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
board_build.f_cpu = 600000000L
build_flags = -DUSB_SERIAL_TOUCH -O2 -Wall
extra_scripts = pre:usb_serial_touch.py
upload_protocol = teensy-gui
monitor_speed = 115200
